apiVersion: v1
kind: Service
metadata:
  name: jingle-backend
  labels:
    app: jingle-backend
    {{- include "jingle.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: jingle-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jingle-backend
  labels:
    app: jingle-backend
    {{- include "jingle.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: jingle-backend
  template:
    metadata:
      labels:
        app: jingle-backend
        {{- include "jingle.labels" . | nindent 8 }}
      annotations:
        # Used by Prometheus (next phase) to find the metrics endpoint
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
        # Restart pods when the DB secret changes
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              value: "jdbc:postgresql://jingle-db:5432/{{ .Values.postgres.database }}"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jingle-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jingle-db-secret
                  key: POSTGRES_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.backend.javaOpts | quote }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36       # allows up to 3 minutes to start
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
